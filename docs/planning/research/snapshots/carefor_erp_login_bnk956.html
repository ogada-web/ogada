<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" lang="ko" xml:lang="ko">
<head>
    <title>장기요양 재무회계 관리프로그램</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="-1"/>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
    <meta name="csrf-token" content="REDACTED">
    <link rel="stylesheet" href="https://erp.carefor.co.kr/css/style_fin.css">
    <script src="https://erp.carefor.co.kr/js/jquery-3.4.1.min.js"></script>
    <script src="https://erp.carefor.co.kr/js/jquery-ui-1.10.4.custom.min.js"></script>
    <script src="https://erp.carefor.co.kr/js/jquery.alphanumeric.js"></script>
    <script src="https://erp.carefor.co.kr/js/jquery.maskedinput-1.3.1.min.js"></script>
    <script src="https://erp.carefor.co.kr/js/ctlLayer.js"></script>
    <script src="https://erp.carefor.co.kr/js/jquery.cookie.js"></script>
    <script src="https://erp.carefor.co.kr/js/common.js"></script>
    <script src="https://erp.carefor.co.kr/js/jquery.tablesorter.js"></script>
</head>

<body>

<script>
    $(document).ready(function () {
        console.log("######### LOGIN");

            });
</script>

<div id="wrap">
    <div id="login_bg">
        <form method="POST" action="https://erp.carefor.co.kr/login">
            <input type="hidden" name="_token" value="REDACTED" autocomplete="off">
            <input type="hidden" name="login_token" value="REDACTED">
            <input type="hidden" name="push_os" id="push_os" value="">
            <input type="hidden" name="push_token" id="push_token" value="REDACTED">
            <input type="hidden" name="push_device" id="push_device" value="">
            <input type="hidden" name="is_device" id="is_device" value="">

            <div class="line80" style="height:122px;"></div>
            <div id="login_title">
                케어포 재무회계
            </div>

            <div id="login_box">
                <div class="line45"></div>

                <div id="login_pos">

                    <input type="text"
                           name="login_id"
                           value=""
                           class="login_input"
                           autocomplete="off"
                           placeholder="이메일을 입력하세요"/>

                    <div class="line10"></div>

                    <input type="password"
                           name="login_password"
                           value=""
                           class="login_input"
                           autocomplete="off"
                           placeholder="비밀번호를 입력하세요."/>

                    <div class="line10"></div>

                    <button type="submit" class="btn_login">로그인</button>

                    <div class="login_ckarea">
                        <label class="ma20r">
                            <input name="rememberId"
                                   type="checkbox"
                                   value="Y"
                                    >
                            아이디 저장
                        </label>
                    </div>

                    <div class="line10"></div>

                    <div class="login_info">
                        ※ 20인치 이상 모니터 권장 (해상도 1920 X 1080 이상)
                    </div>
                </div>
            </div>
        </form>
    </div>

</div>

</body>
</html>
